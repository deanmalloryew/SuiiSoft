:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;

.ctl{display:flex;gap:8px}
button,a.b{font:500 12px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;cursor:pointer;border-radius:2px;border:1px solid var(--bd);background:transparent;color:var(--fg);padding:15px 22px;text-decoration:none;transition:background .2s,border-color .2s,color .2s}
button:focus-visible,a:focus-visible{outline:1px solid var(--fg);outline-offset:3px}
.ctl button{padding:9px 12px;font-size:11px}
button:not(:disabled):hover,a.b:hover{border-color:var(--fg)}
a.b.p,button.p{background:var(--fg);border-color:var(--fg);color:var(--bg)}
a.b.p:hover,button.p:hover{opacity:.85}
.menu{position:fixed;inset:0;z-index:1;background:var(--nav);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);padding:calc(env(safe-area-inset-top,0px) + 96px) 22px 40px;counter-reset:m;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s;overflow:auto}
.menu.open{opacity:1;visibility:visible}
.menu button{counter-increment:m;display:flex;gap:18px;align-items:baseline;width:100%;max-width:736px;margin:0 auto;border:0;border-bottom:1px solid var(--bd);border-radius:0;padding:22px 4px;font:300 clamp(24px,6vw,34px)/1.1 var(--disp);letter-spacing:0;text-transform:none;text-align:left;opacity:0;transform:translateY(14px)}
.menu button::before{content:counter(m,decimal-leading-zero);font:400 12px var(--mono);color:var(--mut)}
.menu.open button{animation:mi .6s cubic-bezier(.2,.7,.2,1) forwards}
.menu button:nth-child(2){animation-delay:.05s}.menu button:nth-child(3){animation-delay:.1s}.menu button:nth-child(4){animation-delay:.15s}.menu button:nth-child(5){animation-delay:.2s}
.menu button.cur{color:var(--mut)}
@keyframes mi{to{opacity:1;transform:none}}
header{padding:72px 0 56px}
.tag{font:500 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.tag::before{content:"// "}
h1{font:300 clamp(52px,15vw,112px)/1 var(--disp);letter-spacing:-.04em;margin:22px 0 24px}
h2{font:400 clamp(24px,6vw,32px)/1.15 var(--disp);letter-spacing:-.02em;margin:0 0 12px}
h2::before{display:block;font:500 12px var(--mono);letter-spacing:.14em;color:var(--mut);margin-bottom:14px}
#trainer h2::before{content:"01 / TRAINER"}#tips h2::before{content:"02 / HABITS"}#v-bot h2::before{content:"BOT / SONNET 5.5"}#v-reg h2::before{content:"ACCOUNT"}#v-about h2::before{content:"ABOUT"}
p{margin:0 0 12px}.mut{color:var(--mut)}
header .mut{max-width:540px;font-size:19px;font-weight:300}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.spec{margin-top:52px;padding:24px 26px;border:1px solid var(--bd);background:var(--card);border-radius:2px;position:relative}
.spec::before{content:"INPUT";position:absolute;top:-9px;left:16px;background:var(--bg);padding:0 8px;font:500 10px var(--mono);letter-spacing:.14em;color:var(--mut)}
.spec q{display:block;font:300 22px/1.45 var(--sans);quotes:none}
.spec mark{background:none;color:var(--fg);border-bottom:1px solid var(--fg)}
.spec small{display:block;margin-top:14px;color:var(--mut);font:400 11px var(--mono);letter-spacing:.1em;text-transform:uppercase}
section{padding:60px 0;border-top:1px solid var(--bd)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:2px;padding:26px;margin-top:24px}
.opts{display:grid;gap:8px;margin-top:20px}
.opts button{font:400 16px/1.35 var(--sans);letter-spacing:0;text-transform:none;text-align:left;padding:15px 18px}
.opts button.ok{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.opts button.no{color:var(--mut);text-decoration:line-through;border-style:dashed}
.opts button:disabled{cursor:default}
.opts button:disabled:not(.ok):not(.no){color:var(--mut)}
.q{font:300 clamp(20px,5vw,24px)/1.4 var(--sans)}
.fb{margin-top:18px;padding:16px 18px;border-left:2px solid var(--fg);background:var(--card);font-size:16px}
.bar{height:1px;background:var(--bd);margin-bottom:18px}
.bar i{display:block;height:1px;background:var(--fg);width:0;transition:width .6s ease}
.cnt{font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-bottom:14px}
.score{font:300 72px/1 var(--disp);margin:6px 0 14px;letter-spacing:-.04em}
.tp{padding:22px 0;border-bottom:1px solid var(--bd)}
.tp:last-child{border-bottom:0}
.tp b{display:block;font:400 18px/1.3 var(--disp);letter-spacing:-.01em}
.tp p{margin:6px 0 0;color:var(--mut)}
textarea,input{display:block;width:100%;font:400 16px/1.5 var(--sans);color:var(--fg);background:transparent;border:1px solid var(--bd);border-radius:2px;padding:14px}
textarea:focus,input:focus{outline:0;border-color:var(--fg)}
textarea{resize:vertical}
.out{white-space:pre-wrap;margin-top:20px;font-size:16px;line-height:1.7}
.sm{font:400 12px/1.6 var(--mono);color:var(--mut);margin-top:16px}
.view{display:none}.view.on{display:block}
footer{position:relative;z-index:1;padding:30px 0 44px;color:var(--mut);font:400 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;border-top:1px solid var(--bd)}
footer .w{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
nav,.view,footer{transition:opacity 1.2s ease .3s}
body.pre{overflow:hidden}
body.pre nav,body.pre .view,body.pre footer{opacity:0}
body.pre nav{pointer-events:none}
.intro{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;cursor:pointer;transition:opacity 1s ease}
.intro.out{opacity:0;pointer-events:none}
.pl{position:relative;width:min(64vw,270px);aspect-ratio:1;display:grid;place-items:center}
